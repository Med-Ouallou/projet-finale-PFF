<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 p-10 space-y-10">
    <div class="pb-6 border-b border-gray-200">
        <p class="text-xs font-bold text-emerald-600 uppercase tracking-widest mb-1">Atom</p>
        <h1 class="text-2xl font-bold font-heading text-gray-900">Nav Links</h1>
        <p class="text-sm text-gray-400 mt-1">États de navigation : Default, Active, Hover, Disabled.</p>
    </div>

    <!-- Horizontal Nav -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 space-y-6">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Nav Horizontale (Header)</p>
        <nav class="flex items-center gap-6 border-b border-gray-100 pb-4">
            <a class="text-sm font-semibold text-emerald-600 border-b-2 border-emerald-500 pb-4 -mb-4 transition-colors"
                href="#">Accueil</a>
            <a class="text-sm font-medium text-gray-500 border-b-2 border-transparent pb-4 -mb-4 hover:text-gray-800 hover:border-gray-300 transition-colors"
                href="#">Menu</a>
            <a class="text-sm font-medium text-gray-500 border-b-2 border-transparent pb-4 -mb-4 hover:text-gray-800 hover:border-gray-300 transition-colors"
                href="#">Dashboard</a>
            <a class="text-sm font-medium text-gray-300 pointer-events-none pb-4" href="#">Désactivé</a>
        </nav>
    </div>

    <!-- Vertical Nav (sidebar style) -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 space-y-4">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Nav Verticale (Sidebar)</p>
        <div class="w-56 space-y-1">
            <a class="flex items-center gap-x-3 py-2.5 px-3 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-100 font-semibold text-sm"
                href="#">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                Dashboard (Actif)
            </a>
            <a class="flex items-center gap-x-3 py-2.5 px-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-800 text-sm transition-colors"
                href="#">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                </svg>
                Commandes
            </a>
            <a class="flex items-center gap-x-3 py-2.5 px-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-800 text-sm transition-colors"
                href="#">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                </svg>
                Analytiques
            </a>
        </div>
    </div>

    <!-- Inline Links -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 space-y-4">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Liens Inline (Corps de texte)</p>
        <div class="flex flex-wrap gap-6">
            <a class="text-sm font-semibold text-emerald-600 hover:text-emerald-500 underline underline-offset-2 transition-colors"
                href="#">Lien principal</a>
            <a class="text-sm text-gray-500 hover:text-gray-700 hover:underline underline-offset-2 transition-colors"
                href="#">Lien secondaire</a>
            <a class="text-sm text-gray-300 pointer-events-none" href="#">Lien désactivé</a>
        </div>
    </div>
</body>

</html>
