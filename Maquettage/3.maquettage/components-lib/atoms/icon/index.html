<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 p-10 space-y-10">
    <div class="pb-6 border-b border-gray-200">
        <p class="text-xs font-bold text-emerald-600 uppercase tracking-widest mb-1">Atom</p>
        <h1 class="text-2xl font-bold font-heading text-gray-900">Icon Wrappers</h1>
        <p class="text-sm text-gray-400 mt-1">Conteneurs standardisés Preline pour les icônes SVG.</p>
    </div>

    <!-- Size Variants -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 space-y-6">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Tailles</p>
        <div class="flex flex-wrap items-end gap-6">
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-8 h-8 bg-emerald-100 text-emerald-600 rounded-lg">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">w-8</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl">
                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">w-10</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">w-12</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl">
                    <svg class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">w-14</span>
            </div>
        </div>
    </div>

    <!-- Color Variants -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 space-y-6">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Couleurs (Sémantique)</p>
        <div class="flex flex-wrap items-end gap-6">
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">Primaire</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-12 h-12 bg-amber-100 text-amber-600 rounded-xl">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 16v-4" />
                        <path d="M12 8h.01" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">Warning</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-12 h-12 bg-red-100 text-red-600 rounded-xl">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
                        <path d="M12 9v4" />
                        <path d="M12 17h.01" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">Danger</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-12 h-12 bg-blue-100 text-blue-600 rounded-xl">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 16v-4" />
                        <path d="M12 8h.01" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">Info</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-12 h-12 bg-violet-100 text-violet-600 rounded-xl">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">Neutre</span>
            </div>
        </div>
    </div>

    <!-- Shape -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 space-y-6">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Formes</p>
        <div class="flex flex-wrap items-center gap-6">
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-12 h-12 bg-emerald-100 text-emerald-600 rounded-lg">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">rounded-lg</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">rounded-xl</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="flex justify-center items-center w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </div>
                <span class="text-xs text-gray-400">rounded-full</span>
            </div>
        </div>
    </div>
</body>

</html>
