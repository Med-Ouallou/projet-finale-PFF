<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        .font-heading {

</head>

<body>

                        gestion de votre restaurant.</p>
                    <div class="mt-5 flex gap-3">
                        <a href="#"
                            class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-800 text-slate-400 hover:bg-emerald-600 hover:text-white transition-colors">

                <div>

                </div>
                <div>

                </div>

                <div class="flex gap-2">

</html>
