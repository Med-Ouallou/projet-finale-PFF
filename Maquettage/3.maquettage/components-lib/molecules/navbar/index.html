<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">
    <div class="p-6 max-w-5xl mx-auto space-y-4">
        <div class="py-4">
            <p class="text-xs font-bold text-emerald-600 uppercase tracking-widest mb-1">Molecule</p>
            <h1 class="text-2xl font-bold font-heading text-gray-900">Navbar</h1>
        </div>
        <!-- Default white header -->
        <div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm">
            <header
                class="flex flex-wrap sm:justify-start sm:flex-nowrap z-50 w-full bg-white border-b border-gray-100 text-sm py-0">
                <nav class="relative w-full mx-auto px-6 sm:flex sm:items-center sm:justify-between"
                    aria-label="Global">
                    <div class="flex items-center justify-between h-16">
                        <a class="flex items-center gap-2.5 text-xl font-bold font-heading text-slate-900" href="#">
                            <div
                                class="flex items-center justify-center w-9 h-9 bg-emerald-600 rounded-xl shadow-lg shadow-emerald-200">
                                <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                                </svg>
                            </div>
                            Resto<span class="text-emerald-600">Manager</span>
                        </a>
                        <div class="sm:hidden">
                            <button type="button"
                                class="hs-collapse-toggle w-9 h-9 flex justify-center items-center rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50"
                                data-hs-collapse="#navbar-demo" aria-controls="navbar-demo" aria-label="Toggle">
                                <svg class="hs-collapse-open:hidden w-4 h-4" fill="currentColor" viewBox="0 0 16 16">
                                    <path fill-rule="evenodd"
                                        d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z" />
                                </svg>
                                <svg class="hs-collapse-open:block hidden w-4 h-4" fill="currentColor"
                                    viewBox="0 0 16 16">
                                    <path
                                        d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="navbar-demo"
                        class="hidden overflow-hidden transition-all duration-300 basis-full grow sm:block">
                        <div
                            class="flex flex-col gap-y-4 gap-x-0 mt-5 sm:flex-row sm:items-center sm:justify-end sm:gap-y-0 sm:gap-x-8 sm:mt-0 sm:ps-7">
                            <a class="font-semibold text-emerald-600 border-b-2 border-emerald-500 pb-4 text-sm"
                                href="#">Accueil</a>
                            <a class="font-medium text-gray-500 hover:text-gray-800 text-sm pb-4 border-b-2 border-transparent hover:border-gray-300 transition-colors"
                                href="#">Menu</a>
                            <a class="font-medium text-gray-500 hover:text-gray-800 text-sm pb-4 border-b-2 border-transparent hover:border-gray-300 transition-colors"
                                href="#">Dashboard</a>
                            <div class="sm:ps-4 pb-4 sm:border-s border-gray-200">
                                <button type="button"
                                    class="py-2.5 px-5 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 shadow-md shadow-emerald-200 transition-all hover:-translate-y-0.5">
                                    Connexion
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>
            </header>
            <div class="p-4 bg-gray-50 text-center text-xs text-gray-400">Sticky Header / Fond blanc / Underline active
            </div>
        </div>
    </div>
</body>

</html>
