<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-white" style="background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 50%, #fff7ed 100%);">
    <div class="max-w-[1200px] mx-auto px-6 py-24">
        <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center">
            <div>
                <span
                    class="inline-flex items-center gap-x-2 py-1.5 px-4 text-xs font-semibold bg-emerald-50 text-emerald-700 rounded-full border border-emerald-200 mb-6">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    Solution de gestion No.1 en France
                </span>
                <h1 class="text-4xl lg:text-5xl font-extrabold font-heading text-gray-900 leading-tight">
                    La gestion de votre restaurant,<br>
                    <span class="text-emerald-600">enfin simplifiée.</span>
                </h1>
                <p class="mt-6 text-lg text-gray-500 leading-relaxed max-w-lg">
                    Commandes, menu, revenus et personnel — tout centralisé dans une interface intuitive.
                </p>
                <div class="mt-8 flex flex-col sm:flex-row gap-3">
                    <button type="button"
                        class="py-3.5 px-7 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 shadow-lg shadow-emerald-200 transition-all hover:-translate-y-0.5">
                        Démarrer gratuitement
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14" />
                            <path d="m12 5 7 7-7 7" />
                        </svg>
                    </button>
                    <button type="button"
                        class="py-3.5 px-7 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-xl border border-gray-200 text-gray-700 bg-white hover:bg-gray-50 shadow-sm transition-all">
                        <svg class="w-4 h-4 text-emerald-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3" />
                        </svg>
                        Voir la démo
                    </button>
                </div>
                <div class="mt-8 pt-8 border-t border-gray-100 flex items-center gap-6 text-sm">
                    <div class="flex -space-x-2">
                        <img class="w-8 h-8 rounded-full border-2 border-white shadow-sm"
                            src="https://i.pravatar.cc/32?img=1" alt="">
                        <img class="w-8 h-8 rounded-full border-2 border-white shadow-sm"
                            src="https://i.pravatar.cc/32?img=5" alt="">
                        <img class="w-8 h-8 rounded-full border-2 border-white shadow-sm"
                            src="https://i.pravatar.cc/32?img=9" alt="">
                    </div>
                    <span class="text-gray-500">Rejoignez <strong class="text-gray-800">2,400+</strong> restaurateurs
                        satisfaits</span>
                </div>
            </div>
            <div class="relative">
                <div
                    class="relative z-10 rounded-2xl overflow-hidden shadow-2xl shadow-slate-200 border border-gray-100">
                    <img class="w-full"
                        src="https://images.unsplash.com/photo-1551218808-94e220e084d2?ixlib=rb-4.0.3&auto=format&fit=crop&w=1400&q=90"
                        alt="Interface RestoManager">
                </div>
                <div
                    class="absolute -bottom-5 -left-6 z-20 bg-white rounded-2xl p-4 shadow-xl border border-gray-100 flex items-center gap-3 w-52">
                    <div
                        class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                            <polyline points="16 7 22 7 22 13" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400">Revenus du mois</p>
                        <p class="text-base font-bold font-heading text-gray-800">+18,420 €</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
