<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 p-10">
    <div class="max-w-xs">
        <div
            class="group flex flex-col bg-white border border-gray-100 shadow-sm rounded-2xl p-7 hover:shadow-lg hover:border-emerald-100 hover:-translate-y-1 transition-all cursor-pointer">
            <div
                class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center mb-5 group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                </svg>
            </div>
            <h3 class="text-lg font-bold font-heading text-gray-800 mb-2">Gestion du Menu</h3>
            <p class="text-gray-400 text-sm leading-relaxed">Ajoutez, modifiez ou supprimez vos plats en quelques clics.
                Gérez vos catégories et vos prix facilement.</p>
            <div class="mt-5 pt-4 border-t border-gray-100">
                <a class="inline-flex items-center gap-x-1.5 text-sm font-semibold text-emerald-600 hover:text-emerald-500 group-hover:gap-x-2.5 transition-all"
                    href="#">
                    En savoir plus
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
