<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 p-8 flex items-center justify-center min-h-screen">

    <!-- MOLECULE : product-card -->
    <div
        class="group flex flex-col bg-white border border-gray-100 shadow-sm rounded-3xl overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-300 w-full max-w-[280px]">
        <div class="relative h-48 overflow-hidden">
            <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
                src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                alt="Plat">
            <!-- Badge -->
            <div class="absolute top-3 left-3 flex flex-col gap-1">
                <span
                    class="py-1 px-3 text-[10px] font-bold bg-emerald-600 text-white rounded-full shadow-lg backdrop-blur-sm self-start uppercase tracking-wider">Chef
                    Pick</span>
            </div>
            <!-- Favorite button -->
            <button
                class="absolute top-3 right-3 p-2 bg-white/80 backdrop-blur-sm rounded-full text-gray-400 hover:text-red-500 transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
            </button>
        </div>

        <div class="p-5 flex flex-col flex-1 text-start">
            <div class="flex justify-between items-start mb-1">
                <h3
                    class="text-base font-bold font-heading text-gray-900 group-hover:text-emerald-700 transition-colors">
                    Bowl Santé Signature</h3>
            </div>
            <p class="text-xs text-gray-400 leading-relaxed line-clamp-2 flex-1 mb-4">Quinoa bio, avocat frais, grenade
                et légumes de saison croquants avec sauce maison.</p>

            <div class="flex justify-between items-center pt-2">
                <div class="flex flex-col">
                    <span class="text-lg font-black font-heading text-emerald-700 leading-none">65.00 DH</span>
                    <span class="text-[9px] text-gray-400 font-bold uppercase tracking-widest mt-0.5">TTC</span>
                </div>
                <button type="button" onclick="addToCart(this)"
                    class="py-2.5 px-5 inline-flex items-center gap-x-1.5 text-xs font-bold rounded-2xl bg-emerald-600 text-white hover:bg-emerald-900 transition-all shadow-lg shadow-emerald-200 active:scale-95 group/btn">
                    <svg class="w-3.5 h-3.5 group-hover/btn:rotate-90 transition-transform"
                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    Ajouter
                </button>
            </div>
        </div>
    </div>
    <!-- / MOLECULE : product-card -->

</body>

</html>
