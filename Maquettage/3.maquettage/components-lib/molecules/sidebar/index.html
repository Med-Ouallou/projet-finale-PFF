    <script>
        // Script pour gérer l'état actif (utile pour les mockups statiques)
        function setActivePage() {
            const currentPath = window.location.pathname;
            const links = document.querySelectorAll('.nav-link');

            links.forEach(link => {
                if (currentPath.includes(link.getAttribute('href'))) {
                    link.classList.remove('text-gray-600', 'font-medium', 'hover:bg-gray-100');
                    link.classList.add('text-emerald-700', 'font-bold', 'bg-emerald-50', 'border', 'border-emerald-100');

                    // Update icon color
                    const svg = link.querySelector('svg');
                    if (svg) {
                        svg.classList.remove('text-gray-400');
                        svg.classList.add('text-emerald-600');
                    }
                }
            });
        }
        document.addEventListener('DOMContentLoaded', setActivePage);
    </script>
