<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 p-8 flex items-center justify-center min-h-screen">
    <div class="text-center">
        <p class="text-xs font-bold text-emerald-600 uppercase tracking-widest mb-3">Molecule — Preline Offcanvas</p>
        <button type="button"
            class="py-3.5 px-7 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 shadow-lg shadow-emerald-200 transition-all hover:-translate-y-0.5"
            data-hs-overlay="#hs-overlay-cart-demo">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
                <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
            Ouvrir le Panier (2 articles)
        </button>
    </div>

    <!-- Cart Drawer -->
    <div id="hs-overlay-cart-demo"
        class="hs-overlay hs-overlay-open:translate-x-0 translate-x-full fixed top-0 end-0 transition-all duration-300 transform h-full max-w-sm w-full z-[80] bg-white border-s border-gray-100 shadow-2xl hidden"
        tabindex="-1">
        <!-- Header -->
        <div class="flex justify-between items-center px-6 py-4 border-b border-gray-100">
            <div>
                <h3 class="font-bold font-heading text-gray-800 text-lg">Mon Panier</h3>
                <p class="text-xs text-gray-400">2 articles</p>
            </div>
            <button type="button"
                class="w-8 h-8 flex justify-center items-center rounded-full hover:bg-gray-100 text-gray-500 transition-colors"
                data-hs-overlay="#hs-overlay-cart-demo">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
        </div>

        <!-- Items -->
        <div class="p-6 space-y-3 overflow-y-auto h-[calc(100%-200px)]">
            <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                <img class="w-14 h-14 rounded-xl object-cover flex-shrink-0"
                    src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80"
                    alt="Bowl">
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold text-gray-800">Bowl Santé Signature</p>
                    <p class="text-xs text-emerald-600 font-bold mt-0.5">14.50 €</p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button
                        class="w-6 h-6 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-xs hover:bg-gray-300 transition-colors font-bold">−</button>
                    <span class="text-sm font-bold text-gray-800 w-4 text-center">1</span>
                    <button
                        class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs hover:bg-emerald-700 transition-colors font-bold">+</button>
                </div>
            </div>

            <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                <img class="w-14 h-14 rounded-xl object-cover flex-shrink-0"
                    src="https://images.unsplash.com/photo-1567620905732-2d1ec7bb7445?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80"
                    alt="Pancakes">
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold text-gray-800">Pancakes Gourmands</p>
                    <p class="text-xs text-emerald-600 font-bold mt-0.5">9.00 €</p>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button
                        class="w-6 h-6 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-xs hover:bg-gray-300 transition-colors font-bold">−</button>
                    <span class="text-sm font-bold text-gray-800 w-4 text-center">1</span>
                    <button
                        class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs hover:bg-emerald-700 transition-colors font-bold">+</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="absolute bottom-0 w-full px-6 py-5 border-t border-gray-100 bg-white">
            <div class="flex justify-between items-center mb-1">
                <span class="text-sm text-gray-500">Sous-total</span>
                <span class="text-sm font-semibold text-gray-700">23.50 €</span>
            </div>
            <div class="flex justify-between items-center mb-4">
                <span class="text-sm text-gray-500">Livraison</span>
                <span
                    class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">Gratuite</span>
            </div>
            <div class="flex justify-between items-center mb-5 pt-3 border-t border-gray-100">
                <span class="text-base font-bold text-gray-800">Total</span>
                <span class="text-xl font-extrabold font-heading text-gray-900">23.50 €</span>
            </div>
            <button type="button"
                class="w-full py-3.5 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-bold rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 shadow-lg shadow-emerald-200/60 transition-all hover:-translate-y-0.5">
                Valider la commande
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14" />
                    <path d="m12 5 7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>
</body>

</html>
