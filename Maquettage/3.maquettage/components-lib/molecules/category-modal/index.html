<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component: Category Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline/dist/preline.css">
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-8">

    <!-- Trigger (Preview Only) -->
    <button type="button" data-hs-overlay="#hs-modal-category"
        class="py-3 px-6 inline-flex items-center gap-x-2 text-sm font-bold rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 shadow-lg shadow-emerald-200/60 transition-all hover:-translate-y-0.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Ajouter une catégorie (Demo)
    </button>

    <!-- MOLECULE : category-modal -->
    <div id="hs-modal-category"
        class="hs-overlay hidden size-full fixed top-0 start-0 z-[80] overflow-x-hidden overflow-y-auto pointer-events-none">
        <div class="hs-overlay-open:opacity-100 hs-overlay-open:duration-500
                    sm:max-w-xl sm:w-full m-3 sm:mx-auto
                    min-h-[calc(100%-3.5rem)] flex items-center">
            <div
                class="w-full flex flex-col bg-white border border-gray-100 shadow-2xl rounded-3xl pointer-events-auto text-start">

                <!-- Header -->
                <div class="flex justify-between items-center py-5 px-6 border-b border-gray-100">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-emerald-100 rounded-xl flex items-center justify-center shrink-0">
                            <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24">
                                <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold font-heading text-gray-900 leading-none">Nouvelle Catégorie</h3>
                            <p class="text-xs text-gray-400 mt-0.5">Organisez vos plats par thématiques.</p>
                        </div>
                    </div>
                    <button type="button" data-hs-overlay="#hs-modal-category"
                        class="size-8 inline-flex justify-center items-center rounded-full border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 transition-colors shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>

                <!-- Body -->
                <div class="p-6 space-y-5">
                    <!-- Nom -->
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-1.5">Nom de la catégorie <span
                                class="text-red-400">*</span></label>
                        <input type="text"
                            class="py-3 px-4 block w-full border border-gray-200 rounded-xl text-sm
                                   focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 bg-gray-50 transition"
                            placeholder="Ex: Desserts Gourmands">
                    </div>

                    <!-- Icon & Color Grid -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-800 mb-1.5">Icône</label>
                            <div class="hs-dropdown relative w-full">
                                <button type="button" class="hs-dropdown-toggle py-3 px-4 inline-flex items-center justify-between w-full gap-x-2
                                           text-sm font-medium rounded-xl border border-gray-200 bg-gray-50 text-gray-700
                                           hover:bg-gray-100 focus:outline-none transition">
                                    <span class="category-icon-label">📁 Par défaut</span>
                                    <svg class="hs-dropdown-open:rotate-180 w-4 h-4 text-gray-400 transition-transform"
                                        fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                </button>
                                <div
                                    class="hs-dropdown-menu transition-[opacity,margin] hs-dropdown-open:opacity-100 opacity-0 hidden
                                            w-full bg-white shadow-xl rounded-2xl border border-gray-100 mt-1 z-[90] p-2">
                                    <a href="#" onclick="selectIcon(this, '🥗 Entrées')"
                                        class="flex items-center py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100 transition-colors">🥗
                                        Entrées</a>
                                    <a href="#" onclick="selectIcon(this, '🍽️ Plats')"
                                        class="flex items-center py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100 transition-colors">🍽️
                                        Plats</a>
                                    <a href="#" onclick="selectIcon(this, '🍰 Desserts')"
                                        class="flex items-center py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100 transition-colors">🍰
                                        Desserts</a>
                                    <a href="#" onclick="selectIcon(this, '🥤 Boissons')"
                                        class="flex items-center py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100 transition-colors">🥤
                                        Boissons</a>
                                    <a href="#" onclick="selectIcon(this, '🍕 Pizzas')"
                                        class="flex items-center py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100 transition-colors">🍕
                                        Pizzas</a>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-800 mb-1.5">Couleur</label>
                            <div class="hs-dropdown relative w-full">
                                <button type="button" class="hs-dropdown-toggle py-3 px-4 inline-flex items-center justify-between w-full gap-x-2
                                           text-sm font-medium rounded-xl border border-gray-200 bg-gray-50 text-gray-700
                                           hover:bg-gray-100 focus:outline-none transition">
                                    <div class="flex items-center gap-2">
                                        <div class="size-3 rounded-full bg-emerald-500 category-color-preview"></div>
                                        <span class="category-color-label">Émeraude</span>
                                    </div>
                                    <svg class="hs-dropdown-open:rotate-180 w-4 h-4 text-gray-400 transition-transform"
                                        fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                </button>
                                <div
                                    class="hs-dropdown-menu transition-[opacity,margin] hs-dropdown-open:opacity-100 opacity-0 hidden
                                            w-full bg-white shadow-xl rounded-2xl border border-gray-100 mt-1 z-[90] p-2">
                                    <a href="#" onclick="selectColor(this, 'Émeraude', 'bg-emerald-500')"
                                        class="flex items-center gap-2 py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100">
                                        <div class="size-3 rounded-full bg-emerald-500"></div> Émeraude
                                    </a>
                                    <a href="#" onclick="selectColor(this, 'Ambre', 'bg-amber-500')"
                                        class="flex items-center gap-2 py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100">
                                        <div class="size-3 rounded-full bg-amber-500"></div> Ambre
                                    </a>
                                    <a href="#" onclick="selectColor(this, 'Bleu', 'bg-blue-500')"
                                        class="flex items-center gap-2 py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100">
                                        <div class="size-3 rounded-full bg-blue-500"></div> Bleu
                                    </a>
                                    <a href="#" onclick="selectColor(this, 'Rose', 'bg-rose-500')"
                                        class="flex items-center gap-2 py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100">
                                        <div class="size-3 rounded-full bg-rose-500"></div> Rose
                                    </a>
                                    <a href="#" onclick="selectColor(this, 'Violet', 'bg-violet-500')"
                                        class="flex items-center gap-2 py-2 px-3 rounded-xl text-sm text-gray-700 hover:bg-gray-100">
                                        <div class="size-3 rounded-full bg-violet-500"></div> Violet
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-1.5">Description (Optionnelle)</label>
                        <textarea
                            class="py-3 px-4 block w-full border border-gray-200 rounded-xl text-sm
                                   focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 bg-gray-50 transition"
                            rows="2" placeholder="Petite note sur cette catégorie..."></textarea>
                    </div>
                </div>

                <!-- Footer -->
                <div class="flex justify-end items-center gap-3 px-6 py-5 border-t border-gray-100">
                    <button type="button" data-hs-overlay="#hs-modal-category"
                        class="py-2.5 px-5 text-sm font-semibold text-gray-500 hover:bg-gray-100 rounded-xl transition-colors">
                        Annuler
                    </button>
                    <button type="button" class="py-2.5 px-6 text-sm font-bold inline-flex items-center gap-x-2 rounded-xl
                               bg-emerald-600 text-white hover:bg-emerald-700 shadow-lg shadow-emerald-200/50
                               transition-all hover:-translate-y-0.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        Créer la catégorie
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function selectIcon(el, label) {
            el.closest('.hs-dropdown').querySelector('.category-icon-label').textContent = label;
        }

        function selectColor(el, label, colorClass) {
            const dropdown = el.closest('.hs-dropdown');
            dropdown.querySelector('.category-color-label').textContent = label;
            const preview = dropdown.querySelector('.category-color-preview');
            preview.className = `size-3 rounded-full ${colorClass} category-color-preview`;
        }

        function initPreline() {
            if (window.HSStaticMethods && typeof window.HSStaticMethods.autoInit === 'function') {
                window.HSStaticMethods.autoInit();
                console.log('Preline initialized');
            }
        }

        document.addEventListener('DOMContentLoaded', initPreline);
        window.addEventListener('load', initPreline);

        let checks = 0;
        const interval = setInterval(() => {
            initPreline();
            if (++checks > 5) clearInterval(interval);
        }, 500);
    </script>
</body>

</html>
