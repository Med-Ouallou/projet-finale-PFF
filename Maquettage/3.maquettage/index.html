<!DOCTYPE html>
<html lang="fr" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Kit Gallery - Resto Manager</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-heading {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 flex h-full overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col h-full flex-shrink-0 shadow-lg z-[100]">
        <div class="p-6 border-b border-slate-100 bg-emerald-900 text-white">
            <h1 class="text-2xl font-bold font-heading">Resto<span class="text-emerald-400">Manager</span></h1>
            <p class="text-xs text-emerald-200/60 mt-1 uppercase tracking-widest font-bold text-[10px]">Maquettage UI
                Kit</p>
        </div>
        <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-4 space-y-8">
            <!-- Mockups Section -->
            <div class="space-y-3">
                <h3 class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest px-2">Mockups (Premium)</h3>
                <div class="space-y-1">
                    <button onclick="loadComponent('mockups/accueil.html', 'Page: Accueil')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-bold text-emerald-600 bg-emerald-50 border border-emerald-100 transition">Page
                        Accueil</button>
                    <button onclick="loadComponent('mockups/admin-dashboard.html', 'Page: Admin Dashboard')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Admin
                        Dashboard</button>
                    <button onclick="loadComponent('mockups/admin-menu-crud.html', 'Page: Admin Menu CRUD')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Gestion
                        Menu (CRUD)</button>
                    <button onclick="loadComponent('mockups/menu.html', 'Page: Menu Online')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Menu
                        Online</button>
                    <button onclick="loadComponent('mockups/contact.html', 'Page: Contact')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Contact</button>
                    <button onclick="loadComponent('mockups/login.html', 'Page: Login')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Page
                        Login</button>
                </div>
            </div>

            <!-- Molécules Section -->
            <div class="space-y-3">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-2">Molécules
                    (Refactorisées)</h3>
                <div class="space-y-1">
                    <button onclick="loadComponent('components-lib/molecules/navbar/index.html', 'Molecule: Navbar')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Navbar</button>
                    <button
                        onclick="loadComponent('components-lib/molecules/hero/index.html', 'Molecule: Hero Section')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Hero
                        Section</button>
                    <button
                        onclick="loadComponent('components-lib/molecules/feature-card/index.html', 'Molecule: Feature Card')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Feature
                        Card</button>
                    <button
                        onclick="loadComponent('components-lib/molecules/features-section/index.html', 'Molecule: Features Section')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Features
                        Section</button>
                    <button onclick="loadComponent('components-lib/molecules/footer/index.html', 'Molecule: Footer')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Footer</button>
                    <button
                        onclick="loadComponent('components-lib/molecules/sidebar/index.html', 'Molecule: Admin Sidebar')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Admin
                        Sidebar</button>
                    <button
                        onclick="loadComponent('components-lib/molecules/stat-card/index.html', 'Molecule: Stat Cards')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Stat
                        Cards</button>
                    <button
                        onclick="loadComponent('components-lib/molecules/orders-table/index.html', 'Molecule: Orders Table')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Orders
                        Table</button>
                    <button
                        onclick="loadComponent('components-lib/molecules/cart-drawer/index.html', 'Molecule: Cart Drawer')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Cart
                        Drawer</button>
                </div>
            </div>

            <!-- Atomes Section -->
            <div class="space-y-3">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-2">Atomes (Atomic Design)
                </h3>
                <div class="space-y-1">
                    <button onclick="loadComponent('components-lib/atoms/button/index.html', 'Atom: Buttons')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Buttons</button>
                    <button onclick="loadComponent('components-lib/atoms/title/index.html', 'Atom: Titles')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Titles
                        (Outfit)</button>
                    <button onclick="loadComponent('components-lib/atoms/text/index.html', 'Atom: Text')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Text
                        (Inter)</button>
                    <button onclick="loadComponent('components-lib/atoms/nav-link/index.html', 'Atom: Nav Links')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Nav
                        Links</button>
                    <button onclick="loadComponent('components-lib/atoms/logo/index.html', 'Atom: Logo')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Logo</button>
                    <button onclick="loadComponent('components-lib/atoms/icon/index.html', 'Atom: Icons')"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 transition">Icon
                        Wrappers</button>
                </div>
            </div>
        </nav>
        <div
            class="p-4 border-t border-slate-100 text-[10px] text-center text-slate-400 tracking-wider font-bold uppercase">
            Preline Premium Edition</div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full bg-slate-200">
        <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm z-10">
            <h2 id="component-title" class="text-sm font-bold text-slate-800 uppercase tracking-wide">Page Accueil</h2>
            <button onclick="openInNewTab()"
                class="inline-flex items-center gap-x-2 py-1.5 px-3 text-xs font-semibold rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 shadow-md shadow-emerald-200 transition-all">
                <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h6v6" />
                    <path d="M10 14 21 3" />
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                </svg>
                Ouvrir
            </button>
        </header>
        <div class="flex-1 overflow-hidden flex justify-center p-8">
            <iframe id="preview-frame" src="mockups/accueil.html"
                class="w-full h-full border-0 bg-white shadow-2xl rounded-2xl transition-all duration-300"></iframe>
        </div>
    </main>

    <script>
        let currentPath = 'mockups/accueil.html';

        function loadComponent(path, title) {
            const frame = document.getElementById('preview-frame');
            const titleEl = document.getElementById('component-title');
            const buttons = document.querySelectorAll('#sidebar-nav button');

            buttons.forEach(btn => btn.classList.remove('bg-emerald-50', 'text-emerald-600', 'font-bold', 'border', 'border-emerald-100'));
            buttons.forEach(btn => btn.classList.add('text-slate-700'));

            if (event) {
                event.target.classList.remove('text-slate-700');
                event.target.classList.add('bg-emerald-50', 'text-emerald-600', 'font-bold', 'border', 'border-emerald-100');
            }

            currentPath = path;
            frame.src = path;
            titleEl.textContent = title;
        }

        function openInNewTab() {
            window.open(currentPath, '_blank');
        }
    </script>
</body>

</html>
